[package]
name = "kite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
smallvec = "1.14"
rayon = "1.10"
fastrand = "2.3"
zstd = { version = "0.13", features = ["zstdmt"] }
mimalloc = { version = "0.1", default-features = false }
crossbeam-channel = "0.5"
memmap2 = "0.9"
flate2 = "1.0"
itoa = "1"
time = { version = "0.3", features = ["formatting"] }
manifolds-rs = "0.1.12"
faer = "0.23.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
