[package]
name = "kite"
version = "0.6.0"
edition = "2021"
description = "K-mer Indexing and Txxx Engine"


[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = { version = "1", features = ["zlib-ng"] }
byteorder = "1"
memmap2 = "0.9"
rayon = "1"
libc = "0.2"
num_cpus = "1"
anyhow = "1"
io-uring = "0.6"
itoa = "1"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
