[package]
name = "kite"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = { version = "1", features = ["zlib-ng"] }
byteorder = "1"
memmap2 = "0.9"
rayon = "1"
libc = "0.2"
num_cpus = "1"
anyhow = "1"
mimalloc = { version = "0.1", default-features = false }
io-uring = "0.6"
itoa = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
