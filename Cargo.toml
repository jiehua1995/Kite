[package]
name = "kite"
version = "0.7.4"
edition = "2021"
description = "K-mer indexing and throughput engine"
authors = ["Jie Hua <Jie.Hua@lmu.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jiehua1995/Kite"
homepage = "https://github.com/jiehua1995/Kite"
documentation = "https://github.com/jiehua1995/Kite"
keywords = ["bioinformatics", "kmer", "genomics", "fastq", "fasta", "sequencing"]
categories = ["command-line-utilities", "science"]
rust-version = "1.78"


[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3"
flate2 = { version = "1", features = ["zlib-ng"] }
byteorder = "1"
memmap2 = "0.9"
rayon = "1"
libc = "0.2"
num_cpus = "1"
anyhow = "1"
indicatif = "0.17"
itoa = "1"
faer = "0.23.2"
manifolds-rs = "0.2.4"
nalgebra = "0.31.4"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
